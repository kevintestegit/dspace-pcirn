<!doctype html>
<html lang="pt-BR">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$emailTitle</title>
</head>
<body style="margin:0; padding:0; background-color:#eef4fb; color:#172b4d; font-family:Arial,Helvetica,sans-serif;">
  <div style="display:none; max-height:0; overflow:hidden; opacity:0; color:transparent;">$emailPreheader</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; background-color:#eef4fb;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:680px; background-color:#ffffff; border:1px solid #d7e3f0;">
          <tr>
            <td style="padding:22px 28px; background-color:#102a43;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="left" valign="middle">
                    <img src="cid:pcirn-dspace-logo" alt="DSpace" width="116" style="display:block; width:116px; height:auto; border:0;">
                  </td>
                  <td align="right" valign="middle">
                    <img src="cid:pcirn-policiacientifica" alt="Polícia Científica do Rio Grande do Norte" width="70" style="display:inline-block; width:70px; height:auto; border:0; margin-left:12px;">
                    <img src="cid:pcirn-estado-rn" alt="Governo do Rio Grande do Norte" width="70" style="display:inline-block; width:70px; height:auto; border:0; margin-left:12px;">
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:34px 36px 28px; color:#172b4d;">
              <h1 style="margin:0 0 22px; color:#102a43; font-size:26px; line-height:34px; font-weight:700;">$emailTitle</h1>
              $emailActionBlock
              <div style="font-size:16px; line-height:26px; color:#314b67;">$emailBodyHtml</div>
            </td>
          </tr>
          <tr>
            <td style="padding:0; background-color:#102a43;">
              <img src="cid:pcirn-footer-bg" alt="" width="680" style="display:block; width:100%; max-width:680px; height:auto; border:0;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;">
                <tr>
                  <td align="center" style="padding:18px 24px 22px; color:#dbeafe; font-size:12px; line-height:18px;">
                    PCIRN &bull; Polícia Científica do Rio Grande do Norte
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
