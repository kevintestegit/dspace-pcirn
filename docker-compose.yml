# Production stack: DSpace backend, Solr and the Angular SSR server.
#
# There is no database container here. DSpace connects over JDBC to the
# PostgreSQL instance administered by the NTI, which must be reachable from
# this host before the stack is started. DB_URL, DB_USERNAME and DB_PASSWORD
# are required; the stack refuses to start without them.
#
# Usage:
#   docker compose -f docker-compose.yml --env-file .env.production up -d
#
# The DSpace schema is NOT migrated on container start. After deploying a
# version that changes the schema, run the migration explicitly and watch its
# output:
#   docker compose -f docker-compose.yml --env-file .env.production \
#     run --rm dspace /dspace/bin/dspace database migrate
#
# UI and REST bind to 127.0.0.1 and expect a TLS reverse proxy in front.
networks:
  dspacenet:
    ipam:
      config:
        # Must remain in sync with proxies__P__trusted__P__ipranges below:
        # the REST API only honours X-Forwarded-* from this range.
        - subnet: ${DSPACE_NETWORK_SUBNET:-10.250.50.0/24}
    external: false

volumes:
  assetstore:
  solr_data:

services:
  dspace:
    image: "${DSPACE_IMAGE:?Set DSPACE_IMAGE to the versioned backend image}"
    restart: unless-stopped
    # Mail settings from smtp.env, exactly as the development stack loads them.
    # The DSpace names (mail.server, mail.server.password, ...) are written with
    # the Compose environment mapping: __P__ becomes "." and __D__ becomes "-".
    # The file is required: PRODUCTION.md tells the operator to create it, and a
    # missing file must fail here instead of silently leaving mail unconfigured.
    env_file:
      - ./smtp.env
    environment:
      # dspace.cfg is overridden through environment variables. The mapping is
      # documented in dspace/config/config-definition.xml:
      #   __P__ => "."      dspace__P__dir       => dspace.dir
      #   __D__ => "-"      google__D__metadata  => google-metadata
      dspace__P__dir: /dspace
      dspace__P__name: ${DSPACE_NAME:-Repositório PCIRN}
      dspace__P__shortname: ${DSPACE_SHORTNAME:-PCIRN}
      # Public URLs are served by the reverse proxy; internal ports must not
      # appear here.
      dspace__P__server__P__url: ${PUBLIC_REST_URL:?Set PUBLIC_REST_URL in .env.production}
      dspace__P__ui__P__url: ${PUBLIC_UI_URL:?Set PUBLIC_UI_URL in .env.production}
      # SSR resolves the backend by container name over the Compose network.
      dspace__P__server__P__ssr__P__url: http://dspace:8080/server
      # External PostgreSQL administered by the NTI.
      db__P__url: ${DB_URL:?Set DB_URL in .env.production}
      db__P__username: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
      db__P__password: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      solr__P__server: http://dspacesolr:8983/solr
      proxies__P__trusted__P__ipranges: ${TRUSTED_PROXY_NETWORK:-10.250.50}
      LOGGING_CONFIG: /dspace/config/log4j2-container.xml
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      # LDAP is unused. Spring Boot still builds an LdapContextSource pointed at
      # localhost:389, which fails the /actuator/health check.
      MANAGEMENT_HEALTH_LDAP_ENABLED: "false"
      MANAGEMENT_HEALTH_GEOIP_ENABLED: "false"
      MANAGEMENT_HEALTH_SEO_ENABLED: "false"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/server/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    depends_on:
      dspacesolr:
        condition: service_healthy
    networks:
      - dspacenet
    ports:
      - host_ip: 127.0.0.1
        published: ${REST_BIND_PORT:-8501}
        target: 8080
    volumes:
      # The assetstore is state and must outlive every image. In production it
      # is a bind mount so it can be inspected, backed up and moved with rsync.
      - ${ASSETSTORE_PATH:?Set ASSETSTORE_PATH in .env.production}:/dspace/assetstore
      # DSpace reads its configuration from the image. The operator's local.cfg
      # is layered on top from outside the image, so settings can change
      # without rebuilding and no local configuration is ever baked in.
      #
      # The default resolves against the Compose project directory, which is
      # what the NTI installer uses: it writes <root>/dspace/config/local.cfg
      # and runs Compose with --project-directory <root>. An operator
      # deploying by hand sets LOCAL_CFG_PATH to a path outside the repository.
      #
      # create_host_path: false is deliberate. Without it Compose silently
      # creates a directory when the path is missing, and DSpace would start
      # against an empty config directory instead of failing.
      - type: bind
        source: ${LOCAL_CFG_PATH:-./dspace/config/local.cfg}
        target: /dspace/config/local.cfg
        read_only: true
        bind:
          create_host_path: false
    # No database wait and no migration: the entrypoint only starts the
    # application. A failed connection or a pending migration surfaces as a
    # startup error instead of an endless loop.
    #
    # A command handed to the service is executed instead of the application, so
    # the administrative commands in docs/operations/PRODUCTION.md work:
    #   docker compose -f docker-compose.yml --env-file .env.production \
    #     run --rm dspace /dspace/bin/dspace database migrate
    # With `sh -c`, the first argument after the script becomes $0 and the rest
    # become "$@". Without the forwarding below the shell would run
    # /dspace/bin/dspace alone and discard `database migrate`.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ "$#" -gt 0 ]; then exec "$0" "$@"; fi
        case "$${dspace__P__server__P__url}" in
          https://*) ;;
          *) echo "PUBLIC_REST_URL must use HTTPS" >&2; exit 1 ;;
        esac
        case "$${dspace__P__ui__P__url}" in
          https://*) ;;
          *) echo "PUBLIC_UI_URL must use HTTPS" >&2; exit 1 ;;
        esac
        exec java -jar /dspace/webapps/server-boot.jar

  dspacesolr:
    image: "${SOLR_IMAGE:?Set SOLR_IMAGE to the versioned Solr image}"
    restart: unless-stopped
    networks:
      dspacenet:
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8983/solr/admin/info/system"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    working_dir: /var/solr/data
    volumes:
      # Solr data may be dropped and rebuilt from the database, so keeping it
      # only avoids a cold rebuild after a simple restart.
      - solr_data:/var/solr/data
    # Root is needed to seed the cores into the mounted data directory; Solr
    # itself then runs as the "solr" user.
    user: root
    entrypoint:
      - /bin/bash
      - '-c'
      - |
        init-var-solr
        precreate-core authority /opt/solr/server/solr/configsets/authority
        cp -r /opt/solr/server/solr/configsets/authority/* authority
        precreate-core oai /opt/solr/server/solr/configsets/oai
        cp -r /opt/solr/server/solr/configsets/oai/* oai
        precreate-core search /opt/solr/server/solr/configsets/search
        cp -r /opt/solr/server/solr/configsets/search/* search
        precreate-core statistics /opt/solr/server/solr/configsets/statistics
        cp -r /opt/solr/server/solr/configsets/statistics/* statistics
        precreate-core qaevent /opt/solr/server/solr/configsets/qaevent
        cp -r /opt/solr/server/solr/configsets/qaevent/* qaevent
        precreate-core suggestion /opt/solr/server/solr/configsets/suggestion
        cp -r /opt/solr/server/solr/configsets/suggestion/* suggestion
        chown -R solr:solr /var/solr
        runuser -u solr -- solr-foreground

  dspace-angular:
    image: "${ANGULAR_IMAGE:?Set ANGULAR_IMAGE to the versioned frontend image}"
    restart: unless-stopped
    depends_on:
      dspace:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DSPACE_UI_SSL: ${DSPACE_UI_SSL:-false}
      DSPACE_UI_HOST: 0.0.0.0
      DSPACE_UI_PORT: 4000
      DSPACE_UI_NAMESPACE: /
      DSPACE_UI_BASEURL: ${PUBLIC_UI_URL:?Set PUBLIC_UI_URL in .env.production}
      DSPACE_REST_SSL: "true"
      DSPACE_REST_HOST: ${PUBLIC_REST_HOST:?Set PUBLIC_REST_HOST in .env.production}
      DSPACE_REST_PORT: 443
      DSPACE_REST_NAMESPACE: /server
      DSPACE_REST_SSRBASEURL: http://dspace:8080/server
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:4000/',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    networks:
      - dspacenet
    ports:
      - host_ip: 127.0.0.1
        published: ${UI_BIND_PORT:-4000}
        target: 4000
