# DSpace Continuous Integration/Build via GitHub Actions
# Concepts borrowed from
# https://docs.github.com/en/free-pro-team@latest/actions/guides/building-and-testing-java-with-maven
name: Build

# Maven is expensive; installer/docs pushes use the small installer workflow.
on:
  pull_request:
    paths:
      - '**/*.java'
      - '**/*.xml'
      - '**/pom.xml'
      - '**/*.properties'
      - '**/*.cfg'
      - '**/*.sql'
      - 'Dockerfile'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      integration:
        description: Run the full integration suite on the GitHub runner
        type: boolean
        default: false
      unit_tests:
        description: Optional Surefire test filter; empty runs all unit tests
        type: string
        default: ''
      integration_tests:
        description: Optional Failsafe test filter; empty runs all integration tests
        type: string
        default: ''

permissions:
  contents: read  #  to fetch code (actions/checkout)

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      # Give Maven 1GB of memory to work with
      MAVEN_OPTS: "-Xmx1024M"
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        type: ${{ github.event_name == 'workflow_dispatch' && inputs.integration && fromJSON('["Unit Tests", "Integration Tests"]') || fromJSON('["Unit Tests"]') }}
    name: Run ${{ matrix.type }}
    # These are the actual CI steps to perform per job
    steps:
      # https://github.com/actions/checkout
      - name: Checkout codebase
        uses: actions/checkout@v7

      # https://github.com/actions/setup-java
      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'
          cache: 'maven'

      # Run one Maven suite at a time on the GitHub runner
      - name: Run Maven ${{ matrix.type }}
        env:
          TEST_FLAGS: ${{ matrix.type == 'Unit Tests' && '-DskipUnitTests=false -Dsurefire.rerunFailingTestsCount=2' || '-DskipIntegrationTests=false -Denforcer.skip=true -Dcheckstyle.skip=true -Dlicense.skip=true -Dxml.skip=true -Dfailsafe.rerunFailingTestsCount=2' }}
          TEST_FILTER: ${{ inputs.unit_tests }}
          INTEGRATION_FILTER: ${{ inputs.integration_tests }}
          TEST_PROPERTY: ${{ matrix.type == 'Unit Tests' && 'test' || 'it.test' }}
        run: |
          filter=()
          if [ "$TEST_PROPERTY" = 'it.test' ]; then
            TEST_FILTER="$INTEGRATION_FILTER"
          fi
          if [ -n "$TEST_FILTER" ]; then
            filter+=("-D${TEST_PROPERTY}=${TEST_FILTER}")
          fi
          mvn --no-transfer-progress -V install -P-assembly -Pcoverage-report $TEST_FLAGS "${filter[@]}"

      # If previous step failed, save results of tests to downloadable artifact for this job
      # (This artifact is downloadable at the bottom of any job's summary page)
      - name: Upload Results of ${{ matrix.type }} to Artifact
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.type }} results
          path: ${{ matrix.type == 'Unit Tests' && '**/target/surefire-reports/**' || '**/target/failsafe-reports/**' }}

      # Upload code coverage report to artifact, so that it can be shared with the 'codecov' job (see below)
      - name: Upload code coverage report to Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.type }} coverage report
          path: 'dspace/target/site/jacoco-aggregate/jacoco.xml'
          retention-days: 14

  # Codecov upload is a separate job in order to allow us to restart this separate from the entire build/test
  # job above. This is necessary because Codecov uploads seem to randomly fail at times.
  # See https://community.codecov.com/t/upload-issues-unable-to-locate-build-via-github-actions-api/3954
  codecov:
    # Must run after 'tests' job above
    needs: tests
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Download artifacts from previous 'tests' job
      - name: Download coverage artifacts
        uses: actions/download-artifact@v8

      - name: Report coverage upload configuration
        if: env.CODECOV_TOKEN == '' || inputs.unit_tests != '' || inputs.integration_tests != ''
        run: echo "Coverage retained in GitHub artifacts. Codecov upload requires a configured token and a full test run."

      - name: Upload full coverage to Codecov
        if: env.CODECOV_TOKEN != '' && inputs.unit_tests == '' && inputs.integration_tests == ''
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: true
          token: ${{ env.CODECOV_TOKEN }}
