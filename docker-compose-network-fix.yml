services:
  dspace-angular:
    networks:
      - dspacenet

networks:
  default:
    name: dspacepci_default
    driver: bridge
    ipam:
      config:
        - subnet: 10.250.51.0/24
          gateway: 10.250.51.1

  dspacenet:
    name: dspacepci_dspacenet
    driver: bridge
    ipam:
      config:
        - subnet: 10.250.50.0/24
          gateway: 10.250.50.1
