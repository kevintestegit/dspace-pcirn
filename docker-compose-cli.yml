# DSpace CLI tasks. With docker-compose.dev.yml it joins the local stack; the
# network name is derived from COMPOSE_PROJECT_NAME so the CLI attaches to the
# same network the backend runs on. Production runs CLI tasks against its own
# stack instead:
#
#   docker compose -f docker-compose.yml --env-file .env.production \
#     run --rm dspace /dspace/bin/dspace <command>
networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}_dspacenet
    external: true

volumes:
  assetstore:

services:
  dspace-cli:
    container_name: dspace-cli
    image: "${DOCKER_REGISTRY:-docker.io}/${DOCKER_OWNER:-dspace}/dspace-cli:${DSPACE_VER:-dspace-9_x}"
    build:
      context: .
      dockerfile: Dockerfile.cli
    environment:
      db__P__url: ${db__P__url:-jdbc:postgresql://dspacedb:5432/dspace}
      db__P__username: ${db__P__username:-dspace}
      db__P__password: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      solr__P__server: ${solr__P__server:-http://dspacesolr:8983/solr}
      LOGGING_CONFIG: ${LOGGING_CONFIG:-/dspace/config/log4j2-container.xml}
    volumes:
      - assetstore:/dspace/assetstore
      - ./dspace/config:/dspace/config
